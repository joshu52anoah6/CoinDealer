# Both payment domains serve the same static build directory.
# Include this server block in the test/prod Nginx configuration.
server {
    listen 80;
    server_name third-pay.bigtktool.shop third-pay.saralive.net;

    root /home/ec2-user/cdn/third-pay;
    index index.html;

    # Keep the SPA entry point fresh after a deployment. Hashed assets remain
    # immutable, while index.html must always be revalidated for new bundles.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Vue Router uses createWebHistory. Merchant and payment deep links are
    # client-side routes, not files on disk, so they must fall back to the SPA
    # entry point.
    location ^~ /merchant/ {
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
