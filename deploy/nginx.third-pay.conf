# Both coin-merchant domains serve the same static build directory.
# Include these locations in the active test/prod Nginx TLS server blocks.
server {
    listen 80;
    server_name coin-merchant.bigtktool.shop coin-merchant.saralive.net;

    root /home/ec2-user/cdn/coin-merchant;
    index index.html;

    # Keep the SPA entry point fresh after a deployment. Hashed assets remain
    # immutable, while index.html must always be revalidated for new bundles.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Hash routes are not sent to Nginx. Keep these fallbacks only for old
    # clean merchant URLs and other legacy direct links.
    location ^~ /merchant/ {
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
